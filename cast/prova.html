<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><title>MQ · prova do Chromecast</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font:18px system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 16px;color:#1d2340}h1{color:#13695f}google-cast-launcher{width:48px;height:48px;display:inline-block;--connected-color:#13695f;--disconnected-color:#5b6f78;cursor:pointer}#st{margin-top:16px;padding:12px 16px;border-radius:12px;background:#eef2f6}button{font:700 18px system-ui;padding:12px 20px;border-radius:10px;border:0;background:#13695f;color:#fff;cursor:pointer}</style>
</head><body>
<h1>Prova do Chromecast · MQ Player</h1>
<p>Abra esta página no <b>Chrome</b> (computador ou telemóvel), na mesma rede Wi-Fi que o Chromecast, e carregue no ícone para escolher a televisão.</p>
<google-cast-launcher></google-cast-launcher>
<p><button id="ping" disabled>Enviar «olá» para a TV</button></p>
<div id="st">À espera do Chromecast…</div>
<script>
const APP_ID='4CAC96C5',NS='urn:x-cast:com.musiquence.mq',st=t=>document.getElementById('st').textContent=t;
window.__onGCastApiAvailable=ok=>{if(!ok){st('Este navegador não tem Google Cast: use o Chrome.');return}
  const ctx=cast.framework.CastContext.getInstance();ctx.setOptions({receiverApplicationId:APP_ID,autoJoinPolicy:chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED});
  ctx.addEventListener(cast.framework.CastContextEventType.SESSION_STATE_CHANGED,e=>{const s=e.sessionState;const ok=s==='SESSION_STARTED'||s==='SESSION_RESUMED';document.getElementById('ping').disabled=!ok;
    st(ok?'Ligado à TV ✔ — na TV deve aparecer «Ligado ✔» depois de enviar o olá.':s==='SESSION_START_FAILED'?'Não foi possível abrir na TV. O Chromecast está registado como aparelho de testes e foi reiniciado?':'À espera do Chromecast…')});
  ctx.addEventListener(cast.framework.CastContextEventType.CAST_STATE_CHANGED,e=>{if(e.castState==='NO_DEVICES_AVAILABLE')st('Não se encontra nenhum Chromecast nesta rede.')})};
document.getElementById('ping').onclick=()=>{const s=cast.framework.CastContext.getInstance().getCurrentSession();if(s)s.sendMessage(NS,{t:'hello'}).then(()=>st('Olá enviado ✔ — veja a TV.'),e=>st('Erro ao enviar: '+e))};
</script>
<script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
</body></html>
